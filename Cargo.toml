[package]
name = "meshtastic-node-manager"
version = "0.1.0"
edition = "2024"
description = "Manage the nodedb of a Meshtastic device"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
comfy-table = "8.0.1"
console = "0.16.6"
env_logger = "0.11.11"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
jiff = "0.2.38"
log = "0.4.34"
meshtastic = "0.1.9"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serialport = { version = "4", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
rstest = "0.28.0"

[profile.release]
lto = true
strip = true
