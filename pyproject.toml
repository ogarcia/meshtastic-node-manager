[project]
name = "meshtastic-node-cleaner"
version = "0.1.0"
description = "Remove stale nodes from a Meshtastic device's nodedb"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshtastic>=2.7.8",
    "rich>=15.0.0",
]

[project.scripts]
meshtastic-node-cleaner = "meshtastic_node_cleaner.main:main"

[tool.setuptools.package-data]
meshtastic_node_cleaner = ["locale/*/LC_MESSAGES/*.po"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
